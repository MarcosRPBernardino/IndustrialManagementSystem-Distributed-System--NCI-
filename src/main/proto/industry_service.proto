syntax = "proto3";

option java_package = "com.industry.grpc";
option java_multiple_files = true;

package industry;

//Service 1
service MachineMonitor {
//Unary RPC
    rpc CheckMachineStatus(StatusRequest) returns (StatusResponse);

//Server side Streaming RPC
    rpc StreamSensorData(MonitorRequest) returns (stream SensorData);
}

//Service 2
service ProductionManager{
//Client side Streaming RPC
    rpc UploadProductionLog(stream LogEntry) returns (ProductionSummary);
}

//Service 3
service EmergencyCenter{
//Bidirectional Streaming RPC
    rpc EmergencyChannel (stream AlertMessage) returns (stream AlertMessage);
}

//Messages

message StatusRequest {string machine_id = 1;}
message StatusResponse {bool is_active = 1; string description = 2;}

message MonitorRequest {string machine_id = 1;}
message SensorData {double temperature = 1; double performance_load = 2;}

message LogEntry {string product_id = 1; int32 quality_score = 2;}
message ProductionSummary {int32 total_processed = 1; double average_quality = 2;}

message AlertMessage {string user = 1; string text = 2; int32 priority = 3;}